# PF-6 dual-CVE end-to-end lab (four containers)
#
# Network design:
#   physarum-pf6-external  — regular bridge (Internet access allowed)
#                            Container A eth0 — Docker sorts alphabetically, so external=eth0
#                            Container A reaches LLM API on this interface
#
#   physarum-pf6-internal  — isolated bridge (internal: true)
#                            Containers B, C and D are ONLY here: no Internet access
#                            Container A eth1 — used to sense/probe Containers B, C and D
#
# Container B (host-b) — Struts 2.5.25: CVE-2020-17530 (HTTP RCE, port 8080)
# Container C (host-c) — Dual-CVE mock:
#                         CVE-2015-3306 ProFTPD mod_copy (TCP/FTP, port 21)
#                         CVE-2025-47812 Wing FTP web admin (HTTP, port 80)
# Container D (host-d) — OgnlExec validation target (Issue #144 north star):
#                         CVE-2021-31805 Apache Struts 2.0.0-2.5.29 (HTTP RCE, port 8090)
#                         Validates LLM-generated OgnlExec.commands from Exploit-DB enrichment
#                         The LLM must discover the technique from enrichment, not from hardcoding
#
# Phase 1 gate: lineage JSON must contain CVE candidate + policy_decision=Accepted + real LLM reasoning_summary
# Phase 2 gate: physarum-maze binary must be running on a target (via exploit → pubkey → SCP → exec)
#               Phase 2 does NOT begin without Manager approval of Phase 1 evidence.
#
# Usage:
#   ./docker/pf6-lab.sh              # Phase 1 — dual-CVE sensing + identification
#   ./docker/pf6-lab.sh --phase2     # Phase 2 — exploit enabled (Manager approval required)
#
# Build images (ALWAYS use desktop-linux builder — never the default cloud builder):
#   docker buildx build --builder desktop-linux \
#     --platform linux/amd64 -f docker/physarum-maze-lab.Dockerfile -t physarum-maze:lab --load .
#   docker buildx build --builder desktop-linux \
#     --platform linux/amd64 -f docker/physarum-target-pf6.Dockerfile -t physarum-target-pf6:lab --load .
#   docker buildx build --builder desktop-linux \
#     --platform linux/amd64 -f docker/physarum-target-dualcve.Dockerfile -t physarum-target-dualcve:lab --load .
#   docker buildx build --builder desktop-linux \
#     --platform linux/amd64 -f docker/physarum-target-ognlexec.Dockerfile -t physarum-target-ognlexec:lab --load .
#
# After evidence committed:
#   docker compose -f docker/docker-compose-pf6.yml down -v

networks:
  physarum-pf6-internal:
    driver: bridge
    internal: true     # Container B: no Internet
    ipam:
      config:
        - subnet: 172.21.0.0/24

  physarum-pf6-external:
    driver: bridge     # Container A: LLM API reachable here

services:
  host-b:
    # CVE-2020-17530 target: Struts 2.5.25 (HTTP RCE, port 8080) + sshd (port 22).
    # No keys pre-planted — ephemeral pubkey injected at runtime via OGNL RCE.
    image: physarum-target-pf6:lab
    container_name: physarum-pf6-target-struts
    networks:
      physarum-pf6-internal:
        ipv4_address: 172.21.0.3
    volumes:
      - ./pf6-target-volume:/tmp/physarum
    restart: "no"

  host-c:
    # Dual-CVE target: two concurrent RCE surfaces on one host.
    #   :21  ProFTPD 1.3.5 mock (CVE-2015-3306 — TCP mod_copy)
    #   :80  Wing FTP Server 7.4.3 mock (CVE-2025-47812 — HTTP Lua injection)
    #   :22  sshd (Phase 2 binary delivery)
    # Build: see Dockerfile header for cloud builder command.
    image: physarum-target-dualcve:lab
    container_name: physarum-pf6-target-dualcve
    networks:
      physarum-pf6-internal:
        ipv4_address: 172.21.0.4
    volumes:
      - ./pf6-dualcve-volume:/tmp/physarum
    restart: "no"

  host-d:
    # OgnlExec validation target (Issue #144 north star).
    # CVE-2021-31805 Apache Struts 2.0.0-2.5.29 — OGNL injection via freemarker.Execute.
    # The LLM must request Exploit-DB enrichment, learn the one-command-per-request technique,
    # and generate OgnlExec.commands autonomously — no hardcoded delivery recipe.
    #   :8090  Struts 2.5.29 web app (CVE-2021-31805 OGNL RCE)
    #   :22    sshd (Phase 2 binary delivery)
    image: physarum-target-ognlexec:lab
    container_name: physarum-pf6-target-ognlexec
    networks:
      physarum-pf6-internal:
        ipv4_address: 172.21.0.5
    volumes:
      - ./pf6-ognlexec-volume:/tmp/physarum
    restart: "no"

  host-a:
    image: physarum-maze:lab
    container_name: physarum-pf6-agent
    depends_on:
      - host-b
      - host-c
      - host-d
    networks:
      physarum-pf6-internal:     # eth1 — Docker sorts alphabetically: external < internal → eth0=ext, eth1=int
        ipv4_address: 172.21.0.2
      physarum-pf6-external:     # eth0 — used to reach LLM API (external bridge)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      RUST_LOG: "physarum_maze=debug,physarum_llm=debug,physarum_sporangium=info"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      PHYSARUM_LLM_LOG_PROMPTS: "${PHYSARUM_LLM_LOG_PROMPTS:-false}"
      PHYSARUM_VULN_INTEL_MODE: "${PHYSARUM_VULN_INTEL_MODE:-auto}"
      PHYSARUM_VULN_INTEL_CACHE_DIR: "/advisory-cache"
      PHYSARUM_TEMPLATE_TAGS: "${PHYSARUM_TEMPLATE_TAGS:-rce,cve}"
      PHYSARUM_TEMPLATE_SEVERITY: "${PHYSARUM_TEMPLATE_SEVERITY:-critical,high}"
      PHYSARUM_EXPLOIT_ENABLED: "${PHYSARUM_EXPLOIT_ENABLED:-false}"
      # Extend stimulus scan to include FTP (:21) for TCP template probing.
      # Override via env or compose .env — no recompile required.
      PHYSARUM_STIMULUS_PORTS: "${PHYSARUM_STIMULUS_PORTS:-21,22,80,443,8080,8090,8443}"
    ports:
      - "8080:8080"   # live organism graph — http://localhost:8080/
    command: >
      --mode seed
      --llm-endpoint ${PHYSARUM_LLM_ENDPOINT:-mock-http}
      --llm-model ${PHYSARUM_LLM_MODEL:-gpt-4o-mini}
      --llm-allowed-cidr 172.16.0.0/12
      --discovery-interval-secs 5
      --stimulus-timeout-secs 120
      --server 8080
    volumes:
      - ./lineage:/tmp
      - ../examples/advisory-cache:/advisory-cache:ro
    restart: "no"
