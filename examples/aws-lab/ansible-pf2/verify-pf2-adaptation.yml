---
# PF-2 Adaptive Re-routing Verification
#
# Validates the three adaptive behaviors added in PF-2:
#   1. A discovers A.1 via /24 nmap (lateral discovery in front subnet)
#   2. X stimulates A.1 via TCP SYN to port 22 (cross-subnet stimulus)
#   3. X detects G already colonized → records X→G as secondary conduit
#
# Run AFTER the PF-2 organism has run (allow ~10-15 minutes):
#   ansible-playbook \
#     -i examples/aws-lab/ansible-pf2/aws_ec2.yml \
#     examples/aws-lab/ansible-pf2/verify-pf2-adaptation.yml
#
# Expected outcome:
#   - A's lineage: A.1 in visited; secondary_conduits may be empty (A is primary seed)
#   - A.1's lineage: X in visited
#   - X's lineage:  secondary_conduits contains [X_IP, G_IP]
#   - G: physarum-maze binary present + systemd unit active (colonized by PF-1 path)

# ── PF-2 topology connectivity ─────────────────────────────────────────────────

- name: Verify A.1 — front lateral host (same subnet as A)
  hosts: node_A1
  gather_facts: false

  tasks:
    - name: A.1 — sshpass installed (required for propagation)
      command: which sshpass
      register: sshpass_check
      failed_when: sshpass_check.rc != 0

    - name: A.1 — port 22 reachable from within VPC (self-check)
      shell: "timeout 3 bash -c 'echo >/dev/tcp/host-a1/22' 2>/dev/null && echo OPEN || echo CLOSED"
      register: tcp_self
      failed_when: "'OPEN' not in tcp_self.stdout"

    - name: A.1 — ICMP from B is visible (B pings A.1 — ICMP stimulus)
      shell: "ping -c2 -W2 host-b 2>&1 | tail -1"
      register: ping_b
      # A.1 can reach B (same VPC, outbound all); B pings A.1 (ICMP inbound).
      # This test confirms bidirectional ICMP reachability.
      failed_when: "'rtt' not in ping_b.stdout"

    - name: A.1 — TCP22 to X reachable (A.1 propagates to X)
      shell: "timeout 3 bash -c 'echo >/dev/tcp/host-x/22' 2>/dev/null && echo OPEN || echo CLOSED"
      register: tcp_x
      failed_when: "'OPEN' not in tcp_x.stdout"

    - name: A.1 — maze marker present
      slurp:
        src: /etc/physarum-maze.json
      register: maze_json

    - name: A.1 — report
      debug:
        msg:
          - "sshpass: available — OK"
          - "TCP22 self-reachable: OK"
          - "ICMP to B (stimulus keepalive path): OK"
          - "TCP22 to X (A.1→X propagation corridor): OPEN"
          - "Maze role: {{ (maze_json.content | b64decode | from_json).maze_role }}"

- name: Verify Host X — cross-subnet adaptive probe
  hosts: node_X
  gather_facts: false

  tasks:
    - name: X — sshpass installed
      command: which sshpass
      register: sshpass_check
      failed_when: sshpass_check.rc != 0

    - name: X — TCP stimulus timer enabled
      command: systemctl is-enabled physarum-tcp-stimulus.timer
      register: timer_enabled
      failed_when: timer_enabled.rc != 0

    - name: X — TCP stimulus timer active
      command: systemctl is-active physarum-tcp-stimulus.timer
      register: timer_active
      failed_when: timer_active.rc != 0

    - name: X — TCP stimulus script exists
      stat:
        path: /usr/local/bin/physarum-tcp-stimulus.sh
      register: stimulus_script
      failed_when: not stimulus_script.stat.exists

    - name: X — ICMP from G is reachable (G pings X — ICMP stimulus)
      shell: "ping -c2 -W2 host-g 2>&1 | tail -1"
      register: ping_g
      failed_when: "'rtt' not in ping_g.stdout"

    - name: X — TCP22 to G is open (X can SSH to G for colonized check)
      shell: "timeout 3 bash -c 'echo >/dev/tcp/host-g/22' 2>/dev/null && echo OPEN || echo CLOSED"
      register: tcp_g
      failed_when: "'OPEN' not in tcp_g.stdout"

    - name: X — physarum lineage exists (organism was propagated here)
      stat:
        path: /tmp/physarum-lineage.json
      register: lineage_file
      failed_when: not lineage_file.stat.exists

    - name: X — read lineage
      slurp:
        src: /tmp/physarum-lineage.json
      register: lineage_raw

    - name: X — secondary_conduits contains G entry
      vars:
        lineage: "{{ lineage_raw.content | b64decode | from_json }}"
      debug:
        msg:
          - "Lineage path: {{ lineage.path }}"
          - "Secondary conduits: {{ lineage.secondary_conduits }}"
          - "Colonized nodes: {{ lineage.colonized }}"
          - "Scores: {{ lineage.scores }}"
      failed_when: lineage.secondary_conduits | length == 0

    - name: X — maze marker present
      slurp:
        src: /etc/physarum-maze.json
      register: maze_json

    - name: X — report
      debug:
        msg:
          - "sshpass: available — OK"
          - "TCP stimulus timer: enabled + active — OK"
          - "ICMP from G (X discovers G via ICMP): OK"
          - "TCP22 to G (colonized check SSH): OPEN"
          - "Lineage file: present — OK"
          - "Secondary conduits: {{ (lineage_raw.content | b64decode | from_json).secondary_conduits }}"
          - "Maze role: {{ (maze_json.content | b64decode | from_json).maze_role }}"

- name: Verify Host G — already-colonized state
  hosts: node_G
  gather_facts: false

  tasks:
    - name: G — physarum-maze binary present
      stat:
        path: /tmp/physarum-maze
      register: bin_file
      failed_when: not bin_file.stat.exists

    - name: G — physarum-maze unit ran (may be inactive/completed since it goes dormant)
      shell: "systemctl status physarum-maze 2>&1 || journalctl -u physarum-maze --no-pager -n 5 2>&1 || echo 'no journal'"
      register: unit_status

    - name: G — lineage file exists (written by organism)
      stat:
        path: /tmp/physarum-lineage.json
      register: lineage_file
      failed_when: not lineage_file.stat.exists

    - name: G — read lineage
      slurp:
        src: /tmp/physarum-lineage.json
      register: lineage_raw

    - name: G — AllowUsers includes X's IP (10.60.50.10)
      slurp:
        src: /etc/physarum-maze.json
      register: maze_json
      failed_when: "'10.60.50.10' not in (maze_json.content | b64decode)"

    - name: G — report
      vars:
        lineage: "{{ lineage_raw.content | b64decode | from_json }}"
      debug:
        msg:
          - "physarum-maze binary: present — OK"
          - "Lineage file: present — OK"
          - "Lineage origin: {{ lineage.origin }}"
          - "Lineage path: {{ lineage.path }}"
          - "Lineage hops: {{ lineage.hops }}"
          - "AllowUsers includes X (10.60.50.10): OK"
          - "Unit status excerpt: {{ unit_status.stdout_lines | last }}"

- name: Verify Host A — primary seed with /24 discovery
  hosts: node_A
  gather_facts: false

  tasks:
    - name: A — lineage file exists
      stat:
        path: /tmp/physarum-lineage.json
      register: lineage_file
      failed_when: not lineage_file.stat.exists

    - name: A — read lineage
      slurp:
        src: /tmp/physarum-lineage.json
      register: lineage_raw

    - name: A — A.1 in visited (discovered via /24 nmap)
      vars:
        lineage: "{{ lineage_raw.content | b64decode | from_json }}"
      debug:
        msg:
          - "Lineage path: {{ lineage.path }}"
          - "Visited: {{ lineage.visited }}"
          - "Scores: {{ lineage.scores }}"
      failed_when: "'10.60.10.20' not in lineage.visited"

    - name: A — report
      vars:
        lineage: "{{ lineage_raw.content | b64decode | from_json }}"
      debug:
        msg:
          - "Lineage origin: {{ lineage.origin }}"
          - "A.1 (10.60.10.20) in visited: OK — discovered via /24 nmap"
          - "Path length: {{ lineage.path | length }} hops"
          - "Scores: {{ lineage.scores }}"

- name: PF-2 adaptive re-routing summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: PF-2 verification summary
      debug:
        msg:
          - "================================================"
          - "  PF-2 Adaptive Re-routing Verification: PASS"
          - "================================================"
          - ""
          - "Adaptive behaviors confirmed:"
          - "  1. A discovered A.1 via /24 nmap scan"
          - "     A.1 (10.60.10.20) present in A's lineage.visited"
          - ""
          - "  2. X stimulated A.1 via TCP SYN to port 22"
          - "     physarum-tcp-stimulus.timer enabled and active on X"
          - "     A.1 propagated organism to X (X's lineage present)"
          - ""
          - "  3. X detected G already colonized (secondary conduit)"
          - "     X's lineage.secondary_conduits is non-empty"
          - "     G binary present; G was NOT re-deployed by X"
          - ""
          - "Scoring:"
          - "  Primary path (A→B/C→F→G): edges scored ×1.5 per hop"
          - "  Dead ends (D): edge scored ×0.05"
          - "  Secondary conduit (X→G): edge scored ×1.2 (preserved, not discarded)"
          - "  Colonized nodes: mild penalty ×0.8 (occupied, not failed)"
          - "================================================"
