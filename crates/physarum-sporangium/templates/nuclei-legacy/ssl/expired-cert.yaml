id: ssl-expired-certificate

info:
  name: Expired SSL/TLS Certificate
  author: projectdiscovery
  severity: high
  description: |
    The SSL/TLS certificate presented by the server has passed its validity period (not_after).
    Clients may reject the connection or show security warnings. May indicate neglected
    certificate lifecycle management.
  remediation: Renew the certificate and configure automated renewal (e.g. via Let's Encrypt / certbot).
  tags: ssl,tls,cert,expired

ssl:
  - address: "{{Host}}:{{Port}}"

    matchers:
      - type: dsl
        dsl:
          - "expired == true"
