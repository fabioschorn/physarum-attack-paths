name: Release

# Disparado quando você faz:
#   git tag v0.2.0
#   git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Necessário para criar releases e fazer upload de assets.
permissions:
  contents: write

jobs:
  # ── Etapa 1: cria o rascunho da Release no GitHub ──────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release (draft)
        run: |
          cat > /tmp/release-notes.md << EOF
          ## physarum-attack-paths ${GITHUB_REF_NAME}

          Research milestone release for the current Physarum organism stack.

          ### Highlights

          - \`physarum-maze\` is the canonical organism binary.
          - \`physarum-scan\` is the native scanner binary from \`physarum-scanner\`.
          - \`physarum-sporangium\` is included as a source/API crate package, because it is currently a library crate, not a standalone binary.
          - \`physarum-llm\` contracts, mock/client path, policy gate, and maze hook are present.
          - Two-container Docker Lab validates the controlled LLM reasoning path.
          - \`physarum-scanner\` exposes organism-native \`SensingProfile\` / \`SensingResult\` evidence.
          - \`physarum-sporangium\` introduces native Rust Nuclei-inspired pattern evidence.
          - Rust 1.86.0 is the pinned project toolchain.

          ### Download

          | Platform     | Artifact |
          |--------------|----------|
          | Linux x86_64 | \`physarum-maze-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux x86_64 | \`physarum-scan-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64  | \`physarum-maze-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64  | \`physarum-scan-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz\` |
          | Source/API   | \`physarum-sporangium-${GITHUB_REF_NAME}-source.tar.gz\` |

          ### Installation

          \`\`\`bash
          tar -xzf physarum-maze-${GITHUB_REF_NAME}-<target>.tar.gz
          ./physarum-maze --help

          tar -xzf physarum-scan-${GITHUB_REF_NAME}-<target>.tar.gz
          ./physarum-scan --help
          \`\`\`

          ### Scope

          This is a controlled research prototype release.
          Use only in owned local, Docker, or AWS lab environments.
          LLM-assisted behavior remains lab-only, bounded, policy-gated, and disabled unless explicitly configured.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "physarum-attack-paths $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 2: build para cada plataforma em paralelo ───────────────────────
  build-release:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os:     ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux ARM64 (cross-compilation via cross)
          - os:     ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Validate workspace
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked

      # Instala `cross` para targets de cross-compilation (ex: Linux ARM64)
      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Build com cargo (nativo)
      - name: Build release binaries (cargo)
        if: matrix.use_cross != true
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p physarum-maze
          cargo build --release --locked --target ${{ matrix.target }} -p physarum-scanner --bin physarum-scan

      # Build com cross (cross-compilation)
      - name: Build release binaries (cross)
        if: matrix.use_cross == true
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p physarum-maze
          cross build --release --locked --target ${{ matrix.target }} -p physarum-scanner --bin physarum-scan

      # ── Empacotamento (.tar.gz) ────────────────────────────────────────────
      - name: Package binaries
        shell: bash
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          TARGET=${{ matrix.target }}

          for BINARY in physarum-maze physarum-scan; do
            ASSET_NAME="${BINARY}-${VERSION}-${TARGET}"
            STAGING="${ASSET_NAME}"

            mkdir -p "$STAGING"
            cp "target/${TARGET}/release/${BINARY}" "$STAGING/"
            cp README.md LICENSE NOTICE "$STAGING/"

            tar -czf "${STAGING}.tar.gz" "$STAGING"
            gh release upload "$VERSION" "${STAGING}.tar.gz" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 3: publica o pacote fonte/API do physarum-sporangium ─────────────
  package-sporangium:
    name: Package physarum-sporangium source/API crate
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package physarum-sporangium source
        shell: bash
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          ASSET_NAME="physarum-sporangium-${VERSION}-source"
          STAGING="$ASSET_NAME"

          mkdir -p "$STAGING/crates"
          cp -R crates/physarum-sporangium "$STAGING/crates/"
          cp Cargo.toml Cargo.lock README.md LICENSE NOTICE "$STAGING/"

          tar -czf "${STAGING}.tar.gz" "$STAGING"
          gh release upload "$VERSION" "${STAGING}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 4: publica a Release (tira do modo draft) ───────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-release, package-sporangium]
    runs-on: ubuntu-latest

    steps:
      - name: Publish Release
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --draft=false \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
