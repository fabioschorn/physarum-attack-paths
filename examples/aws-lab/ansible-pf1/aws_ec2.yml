# AWS EC2 dynamic inventory for PF-1 — Pre-Final Organic Expansion Maze Lab.
#
# Prerequisites:
#   pip install boto3 botocore
#   ansible-galaxy collection install amazon.aws
#   AWS credentials available (env vars or ~/.aws/credentials)
#
# Usage (from repo root, after terraform apply):
#   ansible-inventory -i examples/aws-lab/ansible-pf1/aws_ec2.yml --graph
#   ansible-playbook -i examples/aws-lab/ansible-pf1/aws_ec2.yml \
#     examples/aws-lab/ansible-pf1/verify-maze-connectivity.yml
#
# Filters running instances tagged Project=physarum-attack-paths, Phase=pf-1.
#
# Groups created:
#   node_A  — Host A (seed, front subnet)
#   node_B  — Host B (layer-1)
#   node_C  — Host C (layer-1 bifurcation)
#   node_D  — Host D (layer-2 dead end)
#   node_E  — Host E (layer-2 loop risk)
#   node_F  — Host F (layer-2 valid corridor)
#   node_G  — Host G (layer-3 expansion milestone)
#
#   layer_front  — all hosts in front subnet (A)
#   layer_1      — all hosts in layer-1 (B, C)
#   layer_2      — all hosts in layer-2 (D, E, F)
#   layer_3      — all hosts in layer-3 (G)

plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  tag:Project: physarum-attack-paths
  tag:Phase: pf-1
  instance-state-name: running

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
  ansible_ssh_private_key_file: "'examples/aws-lab/.keys/physarum-lab-devlead'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
  private_ip: private_ip_address

keyed_groups:
  - key: ec2_tags.LabNode
    prefix: node
    separator: "_"
  - key: ec2_tags.MazeLayer
    prefix: maze
    separator: "_"

groups:
  node_A: "ec2_tags.get('LabNode', '') == 'A'"
  node_B: "ec2_tags.get('LabNode', '') == 'B'"
  node_C: "ec2_tags.get('LabNode', '') == 'C'"
  node_D: "ec2_tags.get('LabNode', '') == 'D'"
  node_E: "ec2_tags.get('LabNode', '') == 'E'"
  node_F: "ec2_tags.get('LabNode', '') == 'F'"
  node_G: "ec2_tags.get('LabNode', '') == 'G'"
  layer_front: "ec2_tags.get('MazeLayer', '') == 'front'"
  layer_1:     "ec2_tags.get('MazeLayer', '') == 'layer1'"
  layer_2:     "ec2_tags.get('MazeLayer', '') == 'layer2'"
  layer_3:     "ec2_tags.get('MazeLayer', '') == 'layer3'"
