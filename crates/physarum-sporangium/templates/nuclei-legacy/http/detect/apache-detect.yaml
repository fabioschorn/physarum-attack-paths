id: apache-detect

info:
  name: Apache HTTP Server Detection
  author: projectdiscovery
  severity: info
  description: Detects Apache HTTP server presence via the Server response header.
  tags: tech,apache,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Apache"
        case-insensitive: true

      - type: status
        status:
          - 200
          - 301
          - 302
          - 403
          - 404

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - "Server: Apache/([0-9]+\\.[0-9]+\\.[0-9]+)"
