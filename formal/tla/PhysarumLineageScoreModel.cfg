\* TLC model-checking configuration for PhysarumLineageScoreModel.
\*
\* Run with:
\*   tlc PhysarumLineageScoreModel.tla -config PhysarumLineageScoreModel.cfg
\* or:
\*   java -jar tla2tools.jar PhysarumLineageScoreModel.tla -config PhysarumLineageScoreModel.cfg
\*
\* SCALE = 100 keeps the runtime multipliers exact:
\*   1.5, 0.5, 0.05, 0.8, and 1.2 are all integer factors.
\*
\* SCORE_CEILING = 1000 represents a conservative 10x cap over the neutral
\* runtime score of 1.0. The model proves the bounded contract; the current
\* Rust lineage.scores implementation does not yet enforce this cap.

SPECIFICATION Spec

CONSTANTS
    SCALE         = 100
    MIN_SCORE     = 1
    NEUTRAL_SCORE = 100
    SCORE_CEILING = 1000

INVARIANT TypeOK
INVARIANT Safety
INVARIANT DeadEndPenaltyDominatesReinforcement
INVARIANT MixedFailureCyclesContract
