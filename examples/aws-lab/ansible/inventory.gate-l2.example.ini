# Ansible inventory for Gate L.2 (local-interface scope + inbound eBPF discovery).
#
# Gate L.2 topology — all three agent nodes in the outer /24 (10.50.20.0/24):
#   server-a : 10.50.10.10  (coordinator, management subnet)
#   agent-b  : 10.50.20.10  (node A — eBPF observer + local-interfaces discovery)
#   agent-c  : 10.50.20.20  (node B — inbound TCP stimulus host, port 9002 open)
#   agent-d  : 10.50.20.30  (node C — inbound TCP stimulus host, port 9003 open)
#
# After terraform apply (lab_phase=gate-l2), get public IPs with:
#   terraform -chdir=examples/aws-lab/terraform output
#
# Save your real inventory as inventory.local.ini (gitignored), using the
# group structure below.

[server]
server-a ansible_host=<server_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[server:vars]
coordinator_ip=10.50.10.10

[node_a]
agent-b ansible_host=<agent_b_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[node_b]
agent-c ansible_host=<agent_c_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[node_c]
agent-d ansible_host=<agent_d_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[node_b:vars]
node_a_ip=10.50.20.10

[node_c:vars]
node_a_ip=10.50.20.10

[lab:children]
server
node_a
node_b
node_c
