# physarum-maze Docker Lab — PF-5.1 CVE-aware spore enrichment (Issue #128)
#
# Three-target lab validating the full CVE-aware evidence pipeline:
#
#   host-a (physarum-maze + LLM enabled)
#     │  senses host-b/c/d via /24 periodic discovery
#     │  port 22 closed on all targets → LLM reasoning loop fires
#     │
#     ├─ host-b :80  nginx/1.18.0 (server_tokens on — exposes version)
#     │    Layer 1 → ConfirmedWeb
#     │    spore: server-version-exposed fires → extracted "nginx/1.18.0"
#     │    CVE heuristic → CVE-2021-23017 (CVSS 7.7, nginx < 1.21.0)
#     │      note: CVE-2019-9511 / CVE-2019-9516 require nginx < 1.17.3; 1.18.0 is patched
#     │    DiscoveryQuery carries vulnerability_candidates (non-empty)
#     │    LLM references CVE in reasoning_summary
#     │
#     ├─ host-c :8080 (service_guess="http-alt", Python http.server)
#     │    Layer 1 → ConfirmedWeb
#     │    spore enrichment → PatternFindingSummary → DiscoveryQuery
#     │
#     └─ host-d :7777 (no service_guess, UnknownNeedsMoreSensing → ConfirmedWeb)
#          HTTP probe confirms web service → spore enrichment → DiscoveryQuery
#
# Trigger stimuli after lab starts:
#   docker exec physarum-host-b sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#   docker exec physarum-host-c sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#   docker exec physarum-host-d sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#
# Inspect lineage:
#   cat lineage/physarum-lineage.json | python3 -m json.tool

networks:
  physarum-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  # ── Host B — nginx/1.18.0 on port 80 (CVE-aware enrichment target) ──────────
  #
  # nginx 1.18.0 is affected by:
  #   CVE-2021-23017 — resolver off-by-one (CVSS 7.7, nginx < 1.21.0)      ← applies
  #   CVE-2019-9511  — HTTP/2 Data Dribble DoS (CVSS 7.5, nginx < 1.17.3)  ← NOT applicable (1.18.0 >= 1.17.3)
  #   CVE-2019-9516  — HTTP/2 0-length headers (CVSS 6.5, nginx < 1.17.3)  ← NOT applicable (1.18.0 >= 1.17.3)
  #
  # nginx default configuration has server_tokens on — the Server response header
  # exposes "nginx/1.18.0", which the server-version-exposed spore template extracts.
  # The CVE heuristic enricher in physarum-maze maps this to a VulnerabilityCandidate
  # for CVE-2021-23017 only, making vulnerability_candidates non-empty in the DiscoveryQuery.
  host-b:
    image: nginx:1.18.0
    container_name: physarum-host-b
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.3
    # Port 22 deliberately NOT exposed — triggers LLM reasoning on host-a

  # ── Host C — HTTP on port 8080 (Case 2: ConfirmedWeb via service_guess="http-alt") ──
  #
  # Python http.server serves HTTP on 8080 so physarum-scanner sees:
  #   port=8080, service_guess="http-alt" (starts with "http") → ConfirmedWeb
  # physarum-spore runs all templates against 172.20.0.4:8080.
  host-c:
    image: python:3-alpine
    container_name: physarum-host-c
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.4
    command: ["python3", "-m", "http.server", "8080"]
    # Port 22 NOT exposed — LLM reasoning loop fires for this host too

  # ── Host D — HTTP on port 7777 (Case 3: UnknownNeedsMoreSensing → ConfirmedWeb) ──
  #
  # Port 7777 has no service_guess and scheme_hint=Unknown.
  # Banner grab returns None (Python http.server doesn't greet spontaneously).
  # resolve_classification() triggers targeted HTTP probe:
  #   try_http_probe(172.20.0.5, 7777, Unknown) → http://172.20.0.5:7777/ → 200 OK
  #   → UnknownNeedsMoreSensing resolved to ConfirmedWeb (PF-3.1 adaptive path)
  # physarum-spore runs all templates against 172.20.0.5:7777.
  host-d:
    image: python:3-alpine
    container_name: physarum-host-d
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.5
    command: ["python3", "-m", "http.server", "7777"]
    # Port 22 NOT exposed — LLM reasoning loop fires for this host too

  # ── Host A — physarum-maze agent with LLM enabled ────────────────────────────
  #
  # LLM mode is controlled by host environment variables:
  #
  #   PF-3.1 mock (default — no API key needed):
  #     docker compose up
  #
  #   PF-4 real LLM (OpenAI-compatible endpoint):
  #     export LLM_API_KEY="sk-..."
  #     export PHYSARUM_LLM_ENDPOINT="https://api.openai.com"
  #     export PHYSARUM_LLM_MODEL="gpt-4o-mini"        # optional
  #     docker compose up
  #
  #   PF-4 with local Ollama (Mac host):
  #     export LLM_API_KEY="ollama"
  #     export PHYSARUM_LLM_ENDPOINT="http://host.docker.internal:11434"
  #     export PHYSARUM_LLM_MODEL="llama3.2"
  #     docker compose up
  host-a:
    image: physarum-maze:lab
    container_name: physarum-host-a
    depends_on:
      - host-b
      - host-c
      - host-d
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.2
    cap_add:
      - NET_RAW    # raw ICMP socket
      - NET_ADMIN  # interface binding
    environment:
      # debug level exposes classify_web_candidate decisions per port
      RUST_LOG: "physarum_maze=debug,physarum_llm=debug,physarum_sporangium=info"
      # API key injected from host env — never hardcoded here
      LLM_API_KEY: "${LLM_API_KEY:-}"
      # Set to true for lab evidence capture (logs full prompt + raw LLM response)
      PHYSARUM_LLM_LOG_PROMPTS: "${PHYSARUM_LLM_LOG_PROMPTS:-false}"
    command: >
      --mode seed
      --interface eth0
      --llm-endpoint ${PHYSARUM_LLM_ENDPOINT:-mock-http}
      --llm-model ${PHYSARUM_LLM_MODEL:-gpt-4o-mini}
      --llm-allowed-cidr 172.20.0.0/24
      --discovery-interval-secs 5
      --stimulus-timeout-secs 90
    volumes:
      - ./lineage:/tmp   # lineage JSON written here for inspection
