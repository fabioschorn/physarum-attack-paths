[workspace]
resolver = "2"
members = [
    "crates/physarum-protocol",
    "crates/physarum-server",
    # Future members (uncomment as crates are scaffolded):
    # "crates/physarum-graph",
    # "crates/physarum-ebpf",
    # "crates/physarum-agent",
    # "crates/physarum-coordinator",
    # "crates/physarum-cli",
]

[workspace.package]
version       = "0.0.1"
edition       = "2021"
rust-version  = "1.78"
license       = "Apache-2.0"
authors       = ["Fábio Schorn <fabio.schorn@expertsonline.com.br>"]
repository    = "https://github.com/fabioschorn/physarum-attack-paths"
homepage      = "https://github.com/fabioschorn/physarum-attack-paths"
readme        = "README.md"
keywords      = ["security", "attack-paths", "ebpf", "physarum", "bio-inspired"]
categories    = ["network-programming", "cryptography", "algorithms"]

[workspace.dependencies]
# Core async and runtime
tokio          = { version = "1.40", features = ["full"] }
tokio-util     = { version = "0.7", features = ["full"] }
futures        = "0.3"

# Serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
bincode        = "1.3"

# Cryptography
ed25519-dalek  = { version = "2.1", features = ["rand_core"] }
rand           = "0.8"
sha2           = "0.10"

# Networking and protocol
quinn          = "0.11"
rustls         = "0.23"
axum           = "0.7"
tower          = "0.5"

# Graph algorithms
petgraph       = "0.6"

# Error handling
thiserror      = "1.0"
anyhow         = "1.0"

# Observability
tracing                 = "0.1"
tracing-subscriber      = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry   = "0.25"

# Time
chrono         = { version = "0.4", features = ["serde"] }

# CLI
clap           = { version = "4.5", features = ["derive", "env"] }

# Testing
proptest       = "1.5"
criterion      = { version = "0.5", features = ["html_reports"] }

# Utility
uuid           = { version = "1.10", features = ["v4", "serde"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.bench]
opt-level     = 3
lto           = "thin"
debug         = true

[profile.dev]
opt-level = 0
debug     = true
