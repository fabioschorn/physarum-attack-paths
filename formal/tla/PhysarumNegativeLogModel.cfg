\* TLC model-checking configuration for PhysarumNegativeLogModel.
\*
\* Run with:
\*   tlc PhysarumNegativeLogModel.tla -config PhysarumNegativeLogModel.cfg
\* or:
\*   java -jar tla2tools.jar PhysarumNegativeLogModel.tla -config PhysarumNegativeLogModel.cfg
\*
\* SCALE = 10  →  11^6 = 1,771,561 reachable states (same as PhysarumMultiAgentModel).
\*
\* Constants:
\*   Q_FLOOR    = 1   represents Q_EMA_FLOOR (prevents -ln(0) in the runtime formula)
\*   HOP_FACTOR = 9   represents exp(-HOP_WEIGHT) × SCALE = exp(-0.05) × 10 ≈ 9.512 → 9

SPECIFICATION Spec

CONSTANTS
    SCALE      = 10
    Q_FLOOR    = 1
    HOP_FACTOR = 9

INVARIANT TypeOK
INVARIANT Safety
INVARIANT HopPenaltyBounds
INVARIANT CrossoverCorrectness
