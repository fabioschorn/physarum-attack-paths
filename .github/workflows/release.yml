name: Release

# Disparado quando você faz:
#   git tag v0.3.0
#   git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Necessário para criar releases e fazer upload de assets.
permissions:
  contents: write

jobs:
  # ── Etapa 1: cria o rascunho da Release no GitHub ──────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release (draft)
        run: |
          cat > /tmp/release-notes.md << EOF
          ## physarum-attack-paths ${GITHUB_REF_NAME}

          Research milestone release for the current Physarum organism stack.

          ### Highlights

          - \`physarum-maze\` is the canonical organism binary.
          - \`physarum-scan\` is the native scanner binary from \`physarum-scanner\`.
          - \`physarum-spore\` is the native HTTP pattern-evidence binary from \`physarum-sporangium\`.
          - \`physarum-llm\` contracts, mock/client path, policy gate, and maze hook are present.
          - Two-container Docker Lab validates the controlled LLM reasoning path.
          - \`physarum-scanner\` exposes organism-native \`SensingProfile\` / \`SensingResult\` evidence.
          - \`physarum-sporangium\` introduces native Rust pattern evidence inspired by Nuclei conventions.
          - Rust 1.86.0 is the pinned project toolchain.

          ### Download

          | Platform     | Artifact |
          |--------------|----------|
          | Linux x86_64 | \`physarum-maze-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux x86_64 | \`physarum-scan-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux x86_64 | \`physarum-spore-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\` |

          ### Installation

          \`\`\`bash
          tar -xzf physarum-maze-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz
          ./physarum-maze --help

          tar -xzf physarum-scan-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz
          ./physarum-scan --help

          tar -xzf physarum-spore-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz
          ./physarum-spore --help
          \`\`\`

          ### Scope

          This is a controlled research prototype release.
          Use only in owned local, Docker, or AWS lab environments.
          LLM-assisted behavior remains lab-only, bounded, policy-gated, and disabled unless explicitly configured.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            --title "physarum-attack-paths $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 2a: build Linux x86_64 (glibc) ─────────────────────────────────
  build-release:
    name: Build (x86_64-unknown-linux-gnu)
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Validate workspace
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked

      - name: Build release binaries
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p physarum-maze
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p physarum-scanner --bin physarum-scan
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p physarum-sporangium --bin physarum-spore

      - name: Package binaries
        shell: bash
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          TARGET=x86_64-unknown-linux-gnu

          for BINARY in physarum-maze physarum-scan physarum-spore; do
            ASSET_NAME="${BINARY}-${VERSION}-${TARGET}"
            STAGING="${ASSET_NAME}"

            mkdir -p "$STAGING"
            cp "target/${TARGET}/release/${BINARY}" "$STAGING/"
            cp README.md LICENSE NOTICE "$STAGING/"

            tar -czf "${STAGING}.tar.gz" "$STAGING"
            gh release upload "$VERSION" "${STAGING}.tar.gz" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 2b: build Linux x86_64 (musl static) — physarum-maze only ───────
  # physarum-maze is the propagation binary deployed to target hosts.
  # The musl variant has zero glibc dependency and runs on any Linux kernel,
  # which is required when propagating into older targets (e.g. vulhub images).
  build-release-musl:
    name: Build (x86_64-unknown-linux-musl)
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.86.0 + musl target
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Build physarum-maze (musl static)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p physarum-maze

      - name: Package physarum-maze musl binary
        shell: bash
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          TARGET=x86_64-unknown-linux-musl
          BINARY=physarum-maze
          ASSET_NAME="${BINARY}-${VERSION}-${TARGET}"
          STAGING="${ASSET_NAME}"

          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/${BINARY}" "$STAGING/"
          cp README.md LICENSE NOTICE "$STAGING/"

          tar -czf "${STAGING}.tar.gz" "$STAGING"
          gh release upload "$VERSION" "${STAGING}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Etapa 3: publica a Release (tira do modo draft) ───────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-release, build-release-musl]
    runs-on: ubuntu-latest

    steps:
      - name: Publish Release
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --draft=false \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
