# Example Ansible inventory for the physarum AWS lab.
# Do not commit a real inventory — generate it from Terraform outputs.
#
# After terraform apply, run:
#   terraform -chdir=examples/aws-lab/terraform output -json \
#     > examples/aws-lab/ansible/terraform-outputs.local.json
#
# Then fill in the public IPs from terraform output server_public_ip,
# agent_b_public_ip, agent_c_public_ip, agent_d_public_ip.
#
# Save your real inventory as inventory.local.ini (gitignored).

[server]
server-a ansible_host=<server_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead

[agents]
agent-b ansible_host=<agent_b_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead
agent-c ansible_host=<agent_c_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead
agent-d ansible_host=<agent_d_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead
agent-e ansible_host=<agent_e_public_ip> ansible_user=ec2-user ansible_ssh_private_key_file=examples/aws-lab/.keys/physarum-lab-devlead

[lab:children]
server
agents
