# physarum-maze Docker Lab — PF-3.1 adaptive fingerprint validation
#
# Three-target lab validating the full adaptive evidence pipeline:
#
#   host-a (physarum-maze + LLM enabled)
#     │  senses host-b/c/d via /24 periodic discovery
#     │  port 22 closed on all targets → LLM reasoning loop fires
#     │
#     ├─ host-b :80  (service_guess="http")
#     │    Layer 1 → ConfirmedWeb (service_guess starts with "http")
#     │    banner grab: HTTP GET → scheme_hint=Http, confidence=0.85
#     │    spore enrichment → PatternFindingSummary → DiscoveryQuery
#     │
#     ├─ host-c :8080 (service_guess="http-alt")
#     │    Layer 1 → ConfirmedWeb (service_guess starts with "http")
#     │    banner grab: HTTP GET → scheme_hint=Http, confidence=0.85
#     │    spore enrichment → PatternFindingSummary → DiscoveryQuery
#     │
#     └─ host-d :7777 (no service_guess, scheme_hint=Unknown)
#          Layer 1 → port-convention only, confidence=0.5
#          Layer 2 banner grab → no spontaneous greeting → None
#          Layer 3 HTTP probe → http://172.20.0.5:7777/ → 200 OK
#                → UnknownNeedsMoreSensing resolved to ConfirmedWeb
#          spore enrichment → PatternFindingSummary → DiscoveryQuery
#
# Trigger stimuli after lab starts:
#   docker exec physarum-host-b sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#   docker exec physarum-host-c sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#   docker exec physarum-host-d sh -c "apk add --no-cache iputils -q; ping -c 3 172.20.0.2"
#
# Inspect lineage:
#   cat lineage/physarum-lineage.json | python3 -m json.tool

networks:
  physarum-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  # ── Host B — HTTP on port 80 (Case 1: ConfirmedWeb via service_guess="http") ──
  host-b:
    image: nginx:alpine
    container_name: physarum-host-b
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.3
    # Port 22 deliberately NOT exposed — triggers LLM reasoning on host-a

  # ── Host C — HTTP on port 8080 (Case 2: ConfirmedWeb via service_guess="http-alt") ──
  #
  # Python http.server serves HTTP on 8080 so physarum-scanner sees:
  #   port=8080, service_guess="http-alt" (starts with "http") → ConfirmedWeb
  # physarum-spore runs all templates against 172.20.0.4:8080.
  host-c:
    image: python:3-alpine
    container_name: physarum-host-c
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.4
    command: ["python3", "-m", "http.server", "8080"]
    # Port 22 NOT exposed — LLM reasoning loop fires for this host too

  # ── Host D — HTTP on port 7777 (Case 3: UnknownNeedsMoreSensing → ConfirmedWeb) ──
  #
  # Port 7777 has no service_guess and scheme_hint=Unknown.
  # Banner grab returns None (Python http.server doesn't greet spontaneously).
  # resolve_classification() triggers targeted HTTP probe:
  #   try_http_probe(172.20.0.5, 7777, Unknown) → http://172.20.0.5:7777/ → 200 OK
  #   → UnknownNeedsMoreSensing resolved to ConfirmedWeb (PF-3.1 adaptive path)
  # physarum-spore runs all templates against 172.20.0.5:7777.
  host-d:
    image: python:3-alpine
    container_name: physarum-host-d
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.5
    command: ["python3", "-m", "http.server", "7777"]
    # Port 22 NOT exposed — LLM reasoning loop fires for this host too

  # ── Host A — physarum-maze agent with LLM enabled ────────────────────────────
  host-a:
    image: physarum-maze:lab
    container_name: physarum-host-a
    depends_on:
      - host-b
      - host-c
      - host-d
    networks:
      physarum-lab:
        ipv4_address: 172.20.0.2
    cap_add:
      - NET_RAW    # raw ICMP socket
      - NET_ADMIN  # interface binding
    environment:
      # debug level exposes classify_web_candidate decisions per port
      RUST_LOG: "physarum_maze=debug,physarum_llm=debug,physarum_sporangium=info"
    command: >
      --mode seed
      --interface eth0
      --llm-endpoint mock-http
      --llm-allowed-cidr 172.20.0.0/24
      --discovery-interval-secs 5
      --stimulus-timeout-secs 90
    volumes:
      - ./lineage:/tmp   # lineage JSON written here for inspection
