name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to enumerate commits for pull_request scans.
      pull-requests: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.30.1

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # ── Docker smoke test ────────────────────────────────────────────────────────
  # Uses physarum-maze-lab.Dockerfile (builds only physarum-maze, musl static)
  # instead of the root Dockerfile (builds all 7 workspace binaries).
  # This catches Dockerfile regressions — missing ENTRYPOINT, missing runtime
  # deps — that are invisible to cargo build/test but break the live PF6 lab.
  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (physarum-maze-lab.Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/physarum-maze-lab.Dockerfile
          load: true
          tags: physarum-maze:ci
          build-args: |
            PHYSARUM_GIT_SHA=${{ github.sha }}
            PHYSARUM_BUILD_ID=github-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime binaries
        run: |
          docker run --rm --entrypoint sh physarum-maze:ci -c \
            "which physarum-maze ssh scp ssh-keygen sshpass"

      - name: Verify ENTRYPOINT + agent starts
        run: |
          docker run --rm physarum-maze:ci --help 2>&1 | grep -qi "physarum"

      - name: Verify rich build identity
        run: |
          docker run --rm physarum-maze:ci --version | tee /tmp/version.txt
          grep -q "commit:   ${GITHUB_SHA::7}" /tmp/version.txt
          grep -q "build-id: github-${GITHUB_RUN_ID}" /tmp/version.txt
