[package]
name        = "physarum-sporangium"
description = "Nuclei-inspired evidence enrichment — organism pattern recognition layer (Issue #115)"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
name = "physarum_sporangium"
path = "src/lib.rs"

[[bin]]
name = "physarum-spore"
path = "src/main.rs"

[dependencies]
anyhow     = { workspace = true }
chrono     = { workspace = true }
clap       = { workspace = true }
futures    = { workspace = true }
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
sha2                 = { workspace = true }
regex                = "1"

# DSL expression evaluation
evalexpr = "11"

# HTML parsing (XPath matcher/extractor on HTML)
scraper = "0.21"

# XML parsing + XPath 1.0
sxd-document = "0.3"
sxd-xpath    = "0.4"

# DNS protocol
hickory-client = "0.24"
hickory-proto  = "0.24"

# TLS / SSL protocol
tokio-rustls   = "0.26"
rustls         = { workspace = true }
webpki-roots   = "0.26"
x509-parser    = "0.16"

# WebSocket protocol
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Encoding helpers
base64     = "0.22"
hex        = "0.4"
serde_yaml = "0.9"
walkdir    = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
