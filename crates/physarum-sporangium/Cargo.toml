[package]
name        = "physarum-sporangium"
description = "Nuclei-inspired evidence enrichment — organism pattern recognition layer (Issue #115)"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
name = "physarum_sporangium"
