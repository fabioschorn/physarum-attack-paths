[package]
name              = "physarum-maze"
description       = "PF-1 self-propagating maze agent — single binary, IP-based SSH propagation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "physarum-maze"
path = "src/main.rs"

[dependencies]
tokio      = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = { workspace = true }
chrono     = { workspace = true }

# Raw ICMP socket (CAP_NET_RAW / root required at runtime)
libc = "0.2"

# Base64 encoding for passing lineage JSON as CLI argument
base64 = "0.22"

# Interface IP lookup
if-addrs = "0.7"

# /24 subnet and targeted port discovery (internal TCP-connect scanner)
physarum-scanner = { path = "../physarum-scanner" }

# LLM-aware propagation reasoning — disabled by default unless --llm-endpoint is set
physarum-llm = { path = "../physarum-llm" }

# Nuclei-inspired HTTP pattern evidence enrichment — feeds PatternFinding into DiscoveryQuery
physarum-sporangium = { path = "../physarum-sporangium" }

# Async combinators for concurrent pattern probing
futures = { workspace = true }

# HTTP execution in LLM bootstrap steps (HttpGet / HttpPost actions)
reqwest = { workspace = true }

# Exploit-DB CSV embedding — build.rs compresses the CSV; runtime decompresses in memory
zstd = "0.13"

# Lightweight CSV parsing for the embedded Exploit-DB index
csv = "1.3"

# Lightweight regex for version-range extraction in exploit_db.rs
regex-lite = "0.1"

[build-dependencies]
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# eBPF ring buffer reader — same version as physarum-ebpf-observer
aya     = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"
