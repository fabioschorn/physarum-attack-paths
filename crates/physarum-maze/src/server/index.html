<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>physarum — live organism graph</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #bbb;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px; display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px; background: #0f0f0f;
    border-bottom: 1px solid #1c1c1c; flex-shrink: 0;
  }
  header h1 { font-size: 12px; color: #e8724a; letter-spacing: 0.08em; text-transform: uppercase; }
  #status {
    font-size: 10px; padding: 2px 9px; border-radius: 3px;
    background: #141414; border: 1px solid #2a2a2a;
  }
  #status.connected    { color: #4caf7d; border-color: #1e4a30; }
  #status.connecting   { color: #e8b34a; border-color: #4a3a1a; }
  #status.disconnected { color: #e84a4a; border-color: #4a1a1a; }
  #counters { margin-left: auto; color: #333; font-size: 11px; }
  #counters span { color: #666; margin-left: 14px; }
  #counters span b { color: #999; font-weight: normal; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; }
  #log {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 140px; background: rgba(6,6,6,0.97);
    border-top: 1px solid #222; overflow-y: scroll;
    padding: 5px 14px; font-size: 11px; line-height: 1.75;
  }
  #log::-webkit-scrollbar       { width: 6px; }
  #log::-webkit-scrollbar-track { background: #0a0a0a; }
  #log::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .log-entry            { color: #383838; }
  .log-entry.info       { color: #464646; }
  .log-entry.discovered { color: #2a5a80; }
  .log-entry.colonized  { color: #b85525; }
  .log-entry.edge       { color: #1e4e82; }
</style>
</head>
<body>
<header>
  <h1>physarum organism</h1>
  <div id="status" class="connecting">connecting…</div>
  <div id="counters">
    nodes <span id="cnt-nodes"><b>0</b></span>
    edges <span id="cnt-edges"><b>0</b></span>
    events <span id="cnt-events"><b>0</b></span>
  </div>
</header>
<main>
  <canvas id="c"></canvas>
  <div id="log"></div>
</main>
<script>
// ── state ──────────────────────────────────────────────────────────────────────
const nodes = [];   // {id,x,y,vx,vy,fx,fy,depth,colonized,confidence,cve,pulse,seed}
const edges = [];   // {from,to,conductivity,targetConductivity}

// ── canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, CH = 0;

function resize() {
  const m = canvas.parentElement;
  W  = canvas.width  = m.offsetWidth;
  H  = canvas.height = m.offsetHeight;
  CH = H - 140; // canvas area above the log panel
}
window.addEventListener('resize', resize);

// ── node helpers ──────────────────────────────────────────────────────────────
function findNode(id) {
  for (let i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
  return null;
}

function nodeRadius(n) { return (n.seed ? 36 : 26) + (n.confidence || 0) * 14; }

const RING_RADIUS = 200; // px per depth level

// Count how many nodes already exist at a given depth (for angle distribution).
function nodesAtDepth(d) { return nodes.filter(n => n.depth === d).length; }

// Place a new node exactly on its depth ring, angle evenly distributed
// among siblings to avoid collisions.
function addNode(id, depth, colonized, confidence, cve, seed) {
  if (findNode(id)) return null;
  const cx = W / 2, cy = CH / 2;
  let x, y;
  if (seed || depth === 0) {
    x = cx; y = cy;
  } else {
    // Evenly distribute siblings around the ring; start offset by -90° so
    // first node appears at the top rather than the right.
    const siblings = nodesAtDepth(depth);
    const total    = Math.max(siblings + 1, 1);
    const angle    = -Math.PI / 2 + (siblings / total) * Math.PI * 2;
    const r        = Math.min(depth, 5) * RING_RADIUS;
    x = cx + Math.cos(angle) * r;
    y = cy + Math.sin(angle) * r;
  }
  const n = { id, depth, colonized: !!colonized, confidence: confidence || 0,
               cve: cve || null, pulse: 0, seed: !!(seed || depth === 0),
               x, y, vx: 0, vy: 0, fx: 0, fy: 0 };
  nodes.push(n);
  return n;
}

// ── force-directed layout (Fruchterman-Reingold + depth-ring gravity + cooling) ──
let temperature = 25;  // start cool — ring gravity + prewarm do the heavy work

function layoutStep(dt) {
  if (nodes.length < 2) return;
  const k  = 1.4 * Math.sqrt((W * CH) / nodes.length);
  const k2 = k * k;
  const cx = W / 2, cy = CH / 2;

  for (const n of nodes) { n.fx = 0; n.fy = 0; }

  // repulsion between all pairs
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let dx = nodes[i].x - nodes[j].x || 0.01;
      let dy = nodes[i].y - nodes[j].y || 0.01;
      const d2 = dx*dx + dy*dy || 0.0001;
      const d  = Math.sqrt(d2);
      const f  = k2 / d;
      const ux = dx/d, uy = dy/d;
      nodes[i].fx += f*ux; nodes[i].fy += f*uy;
      nodes[j].fx -= f*ux; nodes[j].fy -= f*uy;
    }
  }

  // attraction along edges
  for (const e of edges) {
    const u = findNode(e.from), v = findNode(e.to);
    if (!u || !v || u === v) continue;
    const dx = v.x - u.x, dy = v.y - u.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 0.1;
    const f  = (d*d) / k;
    const ux = dx/d, uy = dy/d;
    if (!u.seed) { u.fx += f*ux; u.fy += f*uy; }
    if (!v.seed) { v.fx -= f*ux; v.fy -= f*uy; }
  }

  // Depth-ring gravity — each node is pulled toward its ideal orbit radius.
  // This enforces connection ORDER visually: depth 1 = inner ring, depth 2 = outer, etc.
  // Angular position remains free (driven by edge attraction), only radius is constrained.
  for (const n of nodes) {
    if (n.seed) continue;
    const dx   = n.x - cx, dy = n.y - cy;
    const dist  = Math.sqrt(dx*dx + dy*dy) || 1;
    const target = n.depth * RING_RADIUS;
    const drift  = dist - target;          // positive = too far, negative = too close
    const strength = 0.04;                // stronger ring enforcement
    n.fx -= (dx / dist) * drift * strength;
    n.fy -= (dy / dist) * drift * strength;
  }

  const pad = 80;
  for (const n of nodes) {
    if (n.seed) { n.x = cx; n.y = cy; continue; }
    // clamp displacement to current temperature
    const fx = Math.max(-temperature, Math.min(temperature, n.fx));
    const fy = Math.max(-temperature, Math.min(temperature, n.fy));
    n.vx = (n.vx + fx * dt) * 0.75;
    n.vy = (n.vy + fy * dt) * 0.75;
    n.x  = Math.max(pad, Math.min(W  - pad, n.x + n.vx));
    n.y  = Math.max(pad, Math.min(CH - pad, n.y + n.vy));
  }

  // cool down — layout converges and eventually freezes
  temperature = Math.max(1, temperature * 0.985);

  // Lerp each edge conductivity toward its target for smooth visual animation
  for (const e of edges) {
    if (e.targetConductivity !== undefined) {
      e.conductivity += (e.targetConductivity - e.conductivity) * 0.04;
    }
  }
}

// Pre-warm: run layout synchronously so nodes start in good positions
function prewarm(iterations) {
  for (let i = 0; i < iterations; i++) layoutStep(0.3);
}

// ── rendering ─────────────────────────────────────────────────────────────────
function conductivityColor(c) {
  const r = Math.round(74  + (232 - 74)  * c);
  const g = Math.round(140 + (114 - 140) * c);
  const b = Math.round(232 + (74  - 232) * c);
  return `rgb(${r},${g},${b})`;
}

function drawArrow(x1, y1, x2, y2, rEnd, color, lw) {
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const ux = dx/len, uy = dy/len;
  const ex = x2 - ux*rEnd, ey = y2 - uy*rEnd;
  ctx.beginPath();
  ctx.moveTo(x1 + ux*8, y1 + uy*8);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
  // arrowhead
  const s = 8;
  const ax = ex - ux*s, ay = ey - uy*s;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ax - uy*s*0.42, ay + ux*s*0.42);
  ctx.lineTo(ax + uy*s*0.42, ay - ux*s*0.42);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // subtle dot grid
  ctx.fillStyle = '#111';
  const gs = 46;
  for (let gx = gs; gx < W; gx += gs)
    for (let gy = gs; gy < CH; gy += gs) {
      ctx.beginPath(); ctx.arc(gx, gy, 0.7, 0, Math.PI*2); ctx.fill();
    }

  // edges with directed arrows
  for (const e of edges) {
    const u = findNode(e.from), v = findNode(e.to);
    if (!u || !v || u === v) continue;
    const color = conductivityColor(Math.min(1, e.conductivity));
    const lw    = 1 + e.conductivity * 2;
    ctx.globalAlpha = 0.4 + e.conductivity * 0.5;
    drawArrow(u.x, u.y, v.x, v.y, nodeRadius(v), color, lw);
    ctx.globalAlpha = 1;
  }

  // nodes
  for (const n of nodes) {
    const r = nodeRadius(n);

    // pulse ring on colonization event
    if (n.pulse > 0) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + (1-n.pulse)*38, 0, Math.PI*2);
      ctx.strokeStyle = (n.colonized && !n.seed) ? '#FFD700' : '#e8724a'; ctx.lineWidth = 1.5;
      ctx.globalAlpha = n.pulse * 0.5; ctx.stroke(); ctx.globalAlpha = 1;
      n.pulse = Math.max(0, n.pulse - 0.016);
    }

    // seed outer glow ring
    if (n.seed) {
      ctx.beginPath(); ctx.arc(n.x, n.y, r+10, 0, Math.PI*2);
      ctx.strokeStyle = '#e8724a'; ctx.lineWidth = 1;
      ctx.globalAlpha = 0.18; ctx.stroke(); ctx.globalAlpha = 1;
    }

    // node fill
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle   = n.seed       ? '#7a2810'
                    : n.colonized  ? '#FFD700'
                    :                '#0e2438';
    ctx.strokeStyle = n.seed       ? '#e8724a'
                    : n.colonized  ? '#c8a800'
                    :                '#1c4870';
    ctx.lineWidth   = n.seed ? 2.5 : 1.5;
    ctx.fill(); ctx.stroke();

    // confidence arc (green — outer ring showing exploit confidence)
    if ((n.colonized || n.seed) && n.confidence > 0) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r+3.5, -Math.PI/2, -Math.PI/2 + n.confidence*Math.PI*2);
      ctx.strokeStyle = '#3a9a5c'; ctx.lineWidth = 2.5; ctx.stroke();
    }

    // IP label
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = n.seed ? '#f0ddd5' : n.colonized ? '#1a1200' : '#3a7aaa';
    ctx.fillText(n.id, n.x, n.y - 5);

    // depth / role badge
    ctx.font = '9px monospace';
    ctx.fillStyle = n.seed ? '#d86030' : n.colonized ? '#1a1400' : '#2a5a78';
    ctx.fillText(n.seed ? '[ seed ]' : `depth ${n.depth}`, n.x, n.y + 8);

    // CVE badge above node
    if (n.cve) {
      ctx.font = 'bold 9px monospace';
      const tw = ctx.measureText(n.cve).width;
      const bw = tw + 10, bh = 14;
      const bx = n.x - bw/2, by = n.y - r - bh - 5;
      ctx.fillStyle = '#1e1000'; ctx.strokeStyle = '#a07018'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c89030'; ctx.textBaseline = 'middle';
      ctx.fillText(n.cve, n.x, by + bh/2);
    }
  }
}

// ── animation loop ─────────────────────────────────────────────────────────────
function loop() {
  layoutStep(0.25);
  draw();
  requestAnimationFrame(loop);
}

// ── log helpers ────────────────────────────────────────────────────────────────
let eventCount = 0;
const logEl       = document.getElementById('log');
const statusEl    = document.getElementById('status');
const cntNodesEl  = document.getElementById('cnt-nodes');
const cntEdgesEl  = document.getElementById('cnt-edges');
const cntEventsEl = document.getElementById('cnt-events');

function addLog(msg, cls) {
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  const d = document.createElement('div');
  d.className   = 'log-entry' + (cls ? ' '+cls : '');
  d.textContent = new Date().toISOString().slice(11,23) + '  ' + msg;
  logEl.appendChild(d);
  if (logEl.children.length > 400) logEl.removeChild(logEl.firstChild);
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function updateCounters() {
  cntNodesEl.innerHTML  = `<b>${nodes.length}</b>`;
  cntEdgesEl.innerHTML  = `<b>${edges.length}</b>`;
  cntEventsEl.innerHTML = `<b>${eventCount}</b>`;
}

// ── event handling ─────────────────────────────────────────────────────────────
function handleEvent(ev) {
  eventCount++;
  if (ev.type === 'node_discovered') {
    if (!findNode(ev.ip)) {
      addNode(ev.ip, ev.depth, false, 0, null, false);
      addLog(`discovered   ${ev.ip}   depth=${ev.depth}`, 'discovered');
    }

  } else if (ev.type === 'node_colonized') {
    let n = findNode(ev.ip);
    if (!n) n = addNode(ev.ip, ev.depth, false, 0, null, false);
    if (n) {
      n.colonized  = true;
      n.confidence = ev.confidence || 0;
      n.cve        = ev.cve || null;
      n.pulse      = 1.0;
      temperature  = Math.max(temperature, 30); // reheat on new colonization
    }
    addLog(`colonized    ${ev.ip}   conf=${(ev.confidence||0).toFixed(2)}${ev.cve ? '  '+ev.cve : ''}`, 'colonized');

  } else if (ev.type === 'edge_added') {
    if (ev.from === ev.to) return;
    if (!findNode(ev.from)) addNode(ev.from, 0, true, 1.0, null, true);
    if (!findNode(ev.to))   addNode(ev.to,   1, false, 0,   null, false);
    if (!edges.find(e => e.from === ev.from && e.to === ev.to)) {
      const c0 = ev.conductivity || 0.6;
      edges.push({ from: ev.from, to: ev.to, conductivity: c0, targetConductivity: c0 });
      temperature = Math.max(temperature, 20);
      addLog(`edge         ${ev.from} → ${ev.to}`, 'edge');
    }

  } else if (ev.type === 'dij_updated') {
    const e = edges.find(e => e.from === ev.from && e.to === ev.to);
    if (e) {
      e.targetConductivity = ev.conductivity;
      addLog(`D_ij        ${ev.from} → ${ev.to}   c=${ev.conductivity.toFixed(3)}`, 'edge');
    }
  }

  updateCounters();
}

// ── SSE + graph snapshot ───────────────────────────────────────────────────────
function connect() {
  statusEl.className = 'connecting';
  statusEl.textContent = 'connecting…';

  fetch('/graph').then(r => r.json()).then(g => {
    // depth=0 is always the seed — backend emits NodeDiscovered for itself first
    const seedNode = (g.nodes||[]).find(n => n.depth === 0);
    const seedIp   = seedNode ? seedNode.id : null;

    // Seed first — rendered at center before anything else
    if (seedIp) {
      addNode(seedIp, 0, seedNode.colonized, seedNode.confidence || 1.0, seedNode.cve, true);
    }

    // Remaining nodes in depth order
    const sorted = (g.nodes||[]).filter(n => n.id !== seedIp)
                                 .sort((a,b) => a.depth - b.depth);
    for (const n of sorted) {
      addNode(n.id, n.depth, n.colonized, n.confidence, n.cve, false);
    }

    // Edges — ensure from/to nodes exist even if not yet discovered
    for (const e of (g.edges||[])) {
      if (e.from === e.to) continue;
      if (!findNode(e.from)) addNode(e.from, 0, true, 1.0, null, e.from === seedIp);
      if (!findNode(e.to))   addNode(e.to,   1, false, 0,  null, false);
      if (!edges.find(x => x.from === e.from && x.to === e.to)) {
        const c0 = e.conductivity || 0.6;
        edges.push({ from: e.from, to: e.to, conductivity: c0, targetConductivity: c0 });
      }
    }

    // Settle layout before first paint — no bounce on load/refresh
    if (nodes.length > 1) prewarm(800);
    updateCounters();
    addLog(`snapshot loaded — ${nodes.length} nodes, ${edges.length} edges`, 'info');
  }).catch(() => {});

  const es = new EventSource('/events');
  es.onopen = () => {
    statusEl.className = 'connected'; statusEl.textContent = 'live';
    addLog('connected to organism event stream', 'info');
  };
  es.onmessage = e => { try { handleEvent(JSON.parse(e.data)); } catch(_) {} };
  es.onerror   = () => {
    statusEl.className = 'disconnected'; statusEl.textContent = 'reconnecting…';
    es.close(); setTimeout(connect, 3000);
  };
}

// ── boot ──────────────────────────────────────────────────────────────────────
resize();
addLog('physarum organism graph — waiting for events', 'info');
loop();
connect();
</script>
</body>
</html>
