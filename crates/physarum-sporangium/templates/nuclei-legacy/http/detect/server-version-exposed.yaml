id: server-version-exposed

info:
  name: Server Version Exposed in Header
  author: projectdiscovery
  severity: low
  description: |
    The web server exposes its version number in the Server response header.
    This information can be used by attackers to identify known vulnerabilities
    for the specific version in use.
  remediation: Configure the server to suppress or redact the version string
    (e.g. nginx: server_tokens off; Apache: ServerTokens Prod).
  tags: misconfig,generic,version-disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 301
          - 302
          - 403
          - 404

      - type: regex
        part: header
        regex:
          - "Server: (nginx|Apache|OpenSSL|lighttpd|IIS)/[0-9]+\\.[0-9]+"
        case-insensitive: true

    extractors:
      - type: regex
        name: server-version
        part: header
        group: 1
        regex:
          - "Server: ([^\\r\\n]+)"
