[package]
name              = "physarum-scanner"
description       = "Full-featured async port scanner — TCP/UDP, CIDR/DNS resolution, LCG port ordering, scripting engine, rlimit management. Ported and improved from RustScan."

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "physarum-scan"
path = "src/main.rs"

[dependencies]
# workspace
tokio              = { workspace = true }
futures            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
serde              = { workspace = true }
rand               = { workspace = true }
clap               = { workspace = true }
# port scanning / addressing
libc             = "0.2"
gcd              = "2"
cidr-utils       = "0.6"
# DNS resolution
hickory-resolver = { version = "0.24", features = ["dns-over-rustls"] }
# config / scripting
toml             = "1"
dirs             = "6"

[dev-dependencies]
tokio      = { workspace = true, features = ["rt", "net", "time", "macros"] }
serde_json = { workspace = true }
